version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yukakad
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data

  backend:
    image: golang:1.25
    working_dir: /app
    volumes:
      - ./backend:/app
    command: go run ./cmd/api
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/yukakad?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: yukakad-media
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_BASE_URL: http://localhost:9010/yukakad-media
      FRONTEND_ORIGIN: http://localhost:3000,http://localhost:3001
      ADMIN_EMAIL: admin@yukakad.test
      ADMIN_PASSWORD: admin12345
      SMTP_HOST: ""
      SMTP_PORT: 587
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ""
      PAYMENT_WEBHOOK_SECRET: local-webhook-secret
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - minio

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # Removes a stale .next/dev/lock before starting: since .next is bind-mounted
    # from the host, a lock file from a previous container's PID namespace can
    # coincidentally match a live PID in the new container and make next dev think
    # another instance already owns the port, causing it to exit immediately.
    command: sh -c "npm install && rm -f .next/dev/lock && exec npx next dev --hostname 0.0.0.0 --port 3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - backend

volumes:
  postgres_data:
  minio_data:
  frontend_node_modules:
